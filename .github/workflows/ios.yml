name: iOS

# Sprint 81 Task 3 (F67b), first increment: an UNSIGNED compile check of the
# iOS project on a hosted macOS runner. The Mac is the only place Swift and the
# Info.plist build settings can be checked, because the development machine is
# Windows. Task 2 adds signing and TestFlight upload to this file later.
#
# Manual start only (`gh workflow run ios.yml --ref <branch>`); GitHub offers
# workflow_dispatch once this file is on the default branch (develop). No
# secrets: the Flutter SDK version comes from .fvmrc (F296, one source), and the
# Google client IDs are left empty because the build is never run
# (same reasoning as the F127 decision for the CI_* secrets in ci.yml).
on:
  workflow_dispatch:

jobs:
  ios-build:
    name: iOS Build Verification (unsigned)
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: 'stable'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build ios (release, no codesign)
        run: flutter build ios --release --no-codesign
