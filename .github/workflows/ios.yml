name: iOS

# Sprint 81 Task 3 (F67b), first increment: an UNSIGNED compile check of the
# iOS project on a hosted macOS runner. The Mac is the only place Swift and the
# Info.plist build settings can be checked, because the development machine is
# Windows.
#
# Sprint 82 Task 2 (F304): a SIGNED build uploaded to TestFlight, in a second
# job that runs only when started by hand with `testflight: true`:
#   gh workflow run ios.yml --ref <branch> -f testflight=true
# It reads six repository secrets Harold creates (docs/IOS_SETUP.md Part D);
# none of them is ever written to the tree or printed.
#
# Starts: by hand (`gh workflow run ios.yml --ref <branch>`), which GitHub
# allows only once this file is on the default branch (develop) -- verified
# 2026-10-23: "HTTP 404: workflow ios.yml not found on the default branch" --
# and on a push to a feature branch that changes the iOS project or this file
# (a push runs the workflow file from the pushed commit, so it works before the
# first merge). The unsigned job needs no secrets: the Flutter SDK version
# comes from .fvmrc (F296, one source), and the Google client IDs are left
# empty because that build is never run (same reasoning as the F127 decision
# for the CI_* secrets in ci.yml).
on:
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Also build a signed app and upload it to TestFlight'
        type: boolean
        default: false
  push:
    branches: ['feature/**']
    paths:
      - 'mobile-app/ios/**'
      - '.github/workflows/ios.yml'

jobs:
  ios-build:
    name: iOS Build Verification (unsigned)
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: 'stable'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build ios (release, no codesign)
        run: flutter build ios --release --no-codesign

  ios-testflight:
    name: iOS signed build and TestFlight upload
    needs: ios-build
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile-app
    # Secrets are set per step, never at job level, so the third-party
    # flutter-action step never sees them (Sprint 82 security review).
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: 'stable'
          cache: true

      # Fail early, by name, when a secret is missing: an empty Team ID or key
      # otherwise surfaces as an unrelated xcodebuild signing error.
      - name: Check the six signing and sign-in secrets exist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_GMAIL_CLIENT_ID: ${{ secrets.IOS_GMAIL_CLIENT_ID }}
          IOS_GMAIL_REVERSED_CLIENT_ID: ${{ secrets.IOS_GMAIL_REVERSED_CLIENT_ID }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 IOS_GMAIL_CLIENT_ID IOS_GMAIL_REVERSED_CLIENT_ID; do
            if [ -z "${!name}" ]; then echo "::error::repository secret $name is not set (docs/IOS_SETUP.md Part D)"; missing=1; fi
          done
          # 7.7.1 L-2: present is not enough. The reversed ID must be the client
          # ID with its dot-separated parts reversed, or the build uploads and
          # Google sign-in fails only in TestFlight.
          if [ "$missing" = 0 ]; then
            expected=$(printf '%s' "$IOS_GMAIL_CLIENT_ID" | awk -F. '{for (i = NF; i > 0; i--) printf "%s%s", $i, (i > 1 ? "." : "")}')
            if [ "$IOS_GMAIL_REVERSED_CLIENT_ID" != "$expected" ]; then
              echo "::error::IOS_GMAIL_REVERSED_CLIENT_ID is not the reverse of IOS_GMAIL_CLIENT_ID (docs/IOS_SETUP.md Part D)"; missing=1
            fi
          fi
          exit $missing

      # Info.plist reads the Gmail client IDs from Secrets.xcconfig
      # (ios/Flutter/Secrets.xcconfig.example; gitignored), the same file a
      # developer writes by hand. The App Store Connect key goes where
      # xcodebuild looks for it. Both are deleted in the last step.
      - name: Write Secrets.xcconfig and the API key file
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_GMAIL_CLIENT_ID: ${{ secrets.IOS_GMAIL_CLIENT_ID }}
          IOS_GMAIL_REVERSED_CLIENT_ID: ${{ secrets.IOS_GMAIL_REVERSED_CLIENT_ID }}
        run: |
          printf 'IOS_GMAIL_CLIENT_ID = %s\nIOS_GMAIL_REVERSED_CLIENT_ID = %s\n' \
            "$IOS_GMAIL_CLIENT_ID" "$IOS_GMAIL_REVERSED_CLIENT_ID" > ios/Flutter/Secrets.xcconfig
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      - name: flutter pub get
        run: flutter pub get

      # Builds the Flutter part and the Xcode project settings (version and
      # build number come from pubspec.yaml, ADR-0043). APP_ENV=prod matches
      # the store builds on Windows and Android.
      - name: flutter build ios (release, prepare for archive)
        run: flutter build ios --release --no-codesign --dart-define=APP_ENV=prod

      # Automatic signing with the API key: Apple creates the distribution
      # certificate and the App Store profile in the cloud; nothing is stored
      # in the repository.
      - name: xcodebuild archive (signed)
        working-directory: mobile-app/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic

      # destination=upload sends the build straight to App Store Connect, where
      # it appears in TestFlight after Apple's processing.
      - name: xcodebuild -exportArchive (upload to TestFlight)
        working-directory: mobile-app/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Print the version and build number uploaded
        run: |
          grep -E '^version:' pubspec.yaml

      - name: Keep the archive for 7 days
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: ${{ runner.temp }}/Runner.xcarchive
          retention-days: 7

      - name: Delete Secrets.xcconfig and the API key file
        if: always()
        run: |
          rm -f ios/Flutter/Secrets.xcconfig
          rm -rf "$RUNNER_TEMP/asc"

  # Sprint 84 Task 8 (F345): the integration tests and the first-run screens on
  # the iOS Simulator. No signing and no secret: the Google client IDs stay
  # empty, as in ios-build. Runs on the same triggers as ios-build (a push that
  # changes mobile-app/ios/** or this file, and workflow_dispatch).
  #
  # TWO JOBS, run in parallel on two macOS runners (GitHub allows 5 concurrent
  # macOS jobs on every plan, docs.github.com/en/actions/reference/limits). One
  # job did not fit its 75 minutes in run 2 (42252630431). Measured there:
  # boot of both Simulators 11.5 min, explicit simulator build 17.1 min, the
  # first test file 9.4 min and later files about 4 to 5 min each (every
  # `flutter test <file>` runs its own Xcode build), first-run screens about 9 min
  # per device. ios-simulator carries the verdict (build, manifest, tests);
  # ios-simulator-screens carries the screens.
  #
  # The checkout, Flutter setup and pub get steps are COPIED from ios-build, not
  # shared: a composite action or a YAML anchor would mean editing ios-build and
  # ios-testflight, which cannot be tested on this Windows machine, and the card
  # says those two jobs do not change. The Flutter action SHA is the same. The
  # simulator pick step is copied between the two new jobs for the same reason.
  #
  # ios-simulator FAILS when a test file fails, when a file runs zero tests, when
  # the total of passed tests is zero, or when the privacy manifest is not in the
  # built .app (Sprint 83 IMP-3: never green on nothing).
  ios-simulator:
    name: iOS Simulator tests
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile-app
    env:
      # Integration test files NOT in the verdict, one name per word, with the
      # reason (R-2). A test that cannot run is listed here; it is never edited
      # to pass. None of the nine needs a real account or a network sign-in.
      # Details: docs/research/F345_IOS_SIMULATOR_S84.md section 2.
      #  sprint62_surfaces_test.dart: STALE on every platform (the F175 cases and
      #    one F178/F176 case; cases named in the research document).
      # folder_picker_test.dart and safe_sender_lifecycle_test.dart were excluded
      # in runs 1 to 6: the iOS soft keyboard stayed open after enterText and
      # shrank the list. Fixed by dismissKeyboard (helpers/app_harness.dart);
      # both passed on the Simulator in run 7 (42306527432) and are in the
      # verdict from run 8.
      EXCLUDED_TESTS: 'sprint62_surfaces_test.dart'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: 'stable'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Newest installed iOS runtime; an iPhone and an iPad on it. Names are
      # read from the runner, not fixed, so an image update does not break the
      # job (runner image macos-26 lists iPhone 17 and iPad (A16) on iOS 26.5,
      # actions/runner-images macos-26-arm64-Readme.md, image 20261026.0455.2).
      - name: Pick an iPhone and an iPad Simulator
        id: sims
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/sims.json"
          python3 - "$RUNNER_TEMP/sims.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1]))["devices"]
          runtimes = []
          for key, devs in data.items():
              m = re.search(r"iOS-(\d+)-(\d+)", key)
              if m and devs:
                  runtimes.append(((int(m.group(1)), int(m.group(2))), devs))
          if not runtimes:
              sys.exit("no iOS runtime with devices")
          runtimes.sort(key=lambda r: r[0])
          devs = runtimes[-1][1]
          def pick(prefix, preferred):
              cands = [d for d in devs if d["name"].startswith(prefix) and d.get("isAvailable", True)]
              for want in preferred:
                  for d in cands:
                      if d["name"] == want:
                          return d
              if not cands:
                  sys.exit("no simulator starting with " + prefix)
              return cands[0]
          phone = pick("iPhone", ["iPhone 17", "iPhone 17 Pro"])
          pad = pick("iPad", ["iPad (A16)", "iPad Pro 11-inch (M5)"])
          print("iphone_id=" + phone["udid"])
          print("iphone_name=" + phone["name"])
          print("ipad_id=" + pad["udid"])
          print("ipad_name=" + pad["name"])
          print("runtime=" + ".".join(str(x) for x in runtimes[-1][0]))
          PY

      # Only the iPhone boots here: the iPad is used by ios-simulator-screens.
      - name: Boot the iPhone Simulator
        run: |
          echo "iPhone: ${{ steps.sims.outputs.iphone_name }} (iOS ${{ steps.sims.outputs.runtime }})"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool true
          xcrun simctl boot "${{ steps.sims.outputs.iphone_id }}"
          xcrun simctl bootstatus "${{ steps.sims.outputs.iphone_id }}" -b
          xcrun simctl list devices booted

      - name: flutter build ios (simulator, debug, no signing)
        run: flutter build ios --simulator --debug

      # R-4 / AC-4 / T-2: the privacy manifest must be inside the built .app.
      # Also list every manifest in the bundle (Flutter engine and plugins ship
      # their own) so the run shows what Apple's merged report would read.
      - name: Check the privacy manifest is in the built app
        run: |
          app=build/ios/iphonesimulator/Runner.app
          test -d "$app" || { echo "::error::$app not found"; exit 1; }
          echo "Privacy manifests inside the bundle:"
          find "$app" -name 'PrivacyInfo.xcprivacy' | sort
          if [ ! -f "$app/PrivacyInfo.xcprivacy" ]; then
            echo "::error::Runner.app/PrivacyInfo.xcprivacy is missing: the file is not in the Runner target Resources"
            exit 1
          fi
          plutil -lint "$app/PrivacyInfo.xcprivacy"
          plutil -p "$app/PrivacyInfo.xcprivacy"

      # One flutter test process per file, as scripts/run-integration-tests.py
      # does on Windows (TESTING_STRATEGY.md "Execution model"). The first-run
      # screens test needs dart-defines and runs in ios-simulator-screens.
      - name: Run the integration tests on the iPhone Simulator
        env:
          UDID: ${{ steps.sims.outputs.iphone_id }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/it-logs"
          summary="$GITHUB_STEP_SUMMARY"
          { echo "### Integration tests on ${{ steps.sims.outputs.iphone_name }} (iOS ${{ steps.sims.outputs.runtime }})"; echo; echo "| File | Result | Passed |"; echo "| --- | --- | --- |"; } >> "$summary"
          total=0; bad=0; ran=0
          for f in integration_test/*_test.dart; do
            name=$(basename "$f")
            [ "$name" = "ios_first_run_screens_test.dart" ] && continue
            case " $EXCLUDED_TESTS " in
              *" $name "*) echo "EXCLUDED $name"; echo "| $name | excluded | - |" >> "$summary"; continue;;
            esac
            ran=$((ran + 1))
            flutter test "$f" -d "${UDID}" > "$RUNNER_TEMP/it-logs/$name.log" 2>&1
            code=$?
            n=$(grep -oE '[0-9]+ tests? passed' "$RUNNER_TEMP/it-logs/$name.log" | tail -1 | grep -oE '^[0-9]+' || true)
            n=${n:-0}
            if [ "$code" -ne 0 ]; then
              result="FAILED (exit $code)"; bad=$((bad + 1))
            elif [ "$n" -eq 0 ]; then
              result="FAILED (zero tests ran)"; bad=$((bad + 1))
            else
              result="passed"
            fi
            total=$((total + n))
            echo "$name: $result, $n passed"
            echo "| $name | $result | $n |" >> "$summary"
            [ "$code" -ne 0 ] && tail -40 "$RUNNER_TEMP/it-logs/$name.log"
          done
          echo "Files run: $ran, passed tests: $total, failed files: $bad"
          echo "" >> "$summary"; echo "Files run: $ran. Passed tests: $total. Failed files: $bad." >> "$summary"
          if [ "$ran" -eq 0 ] || [ "$total" -eq 0 ]; then
            echo "::error::zero integration tests ran on the Simulator"; exit 1
          fi
          [ "$bad" -eq 0 ] || { echo "::error::$bad integration test file(s) failed"; exit 1; }

      - name: Upload the test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-test-logs
          path: ${{ runner.temp }}/it-logs
          if-no-files-found: warn
          retention-days: 14

  # Second job of F345: the first-run screens on an iPhone-size and an iPad-size
  # Simulator (R-3, AC-3). The
  # iPad leg is the screens test; a separate iPad smoke run was dropped (run 2
  # measured 8.8 min for it) because the screens test boots the same temp-DB
  # harness on the iPad and renders five screens there. The smoke test itself
  # runs on the iPhone in ios-simulator (AC-1). No explicit build step: each
  # `flutter test` builds its own app.
  # Limit 100 minutes: run 5 took 69 minutes, and run 7 (42306527432) was
  # cancelled at the old 75-minute limit while capturing the screens (each
  # `flutter test` does its own Xcode build). Build sharing is an F350 lead.
  ios-simulator-screens:
    name: iOS Simulator screens
    runs-on: macos-26
    timeout-minutes: 100
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: 'stable'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Newest installed iOS runtime; an iPhone and an iPad on it. Names are
      # read from the runner, not fixed, so an image update does not break the
      # job (runner image macos-26 lists iPhone 17 and iPad (A16) on iOS 26.5,
      # actions/runner-images macos-26-arm64-Readme.md, image 20261026.0455.2).
      - name: Pick an iPhone and an iPad Simulator
        id: sims
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/sims.json"
          python3 - "$RUNNER_TEMP/sims.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1]))["devices"]
          runtimes = []
          for key, devs in data.items():
              m = re.search(r"iOS-(\d+)-(\d+)", key)
              if m and devs:
                  runtimes.append(((int(m.group(1)), int(m.group(2))), devs))
          if not runtimes:
              sys.exit("no iOS runtime with devices")
          runtimes.sort(key=lambda r: r[0])
          devs = runtimes[-1][1]
          def pick(prefix, preferred):
              cands = [d for d in devs if d["name"].startswith(prefix) and d.get("isAvailable", True)]
              for want in preferred:
                  for d in cands:
                      if d["name"] == want:
                          return d
              if not cands:
                  sys.exit("no simulator starting with " + prefix)
              return cands[0]
          phone = pick("iPhone", ["iPhone 17", "iPhone 17 Pro"])
          pad = pick("iPad", ["iPad (A16)", "iPad Pro 11-inch (M5)"])
          print("iphone_id=" + phone["udid"])
          print("iphone_name=" + phone["name"])
          print("ipad_id=" + pad["udid"])
          print("ipad_name=" + pad["name"])
          print("runtime=" + ".".join(str(x) for x in runtimes[-1][0]))
          PY

      - name: Boot both Simulators
        run: |
          echo "iPhone: ${{ steps.sims.outputs.iphone_name }} (iOS ${{ steps.sims.outputs.runtime }})"
          echo "iPad:   ${{ steps.sims.outputs.ipad_name }} (iOS ${{ steps.sims.outputs.runtime }})"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool true
          for id in "${{ steps.sims.outputs.iphone_id }}" "${{ steps.sims.outputs.ipad_id }}"; do
            xcrun simctl boot "$id"
            xcrun simctl bootstatus "$id" -b
          done
          xcrun simctl list devices booted

      # R-3 / AC-3: five first-run screens on each device size. The test writes
      # PNG files to a folder on the Mac (a Simulator app runs as a Mac process;
      # run 2 proved the write reaches the runner disk) and fails when a file
      # is not written.
      - name: Capture the first-run screens (iPhone and iPad)
        run: |
          shots="$RUNNER_TEMP/screens"
          mkdir -p "$shots"
          flutter test integration_test/ios_first_run_screens_test.dart -d "${{ steps.sims.outputs.iphone_id }}" \
            --dart-define=SCREENSHOT_DIR="$shots" --dart-define=SCREENSHOT_LABEL=iphone
          flutter test integration_test/ios_first_run_screens_test.dart -d "${{ steps.sims.outputs.ipad_id }}" \
            --dart-define=SCREENSHOT_DIR="$shots" --dart-define=SCREENSHOT_LABEL=ipad
          ls -l "$shots"
          for label in iphone ipad; do
            c=$(ls "$shots" | grep -c "^$label-[1-5]-" || true)
            [ "$c" -eq 5 ] || { echo "::error::expected 5 $label screens, found $c"; exit 1; }
          done

      - name: Upload the screens
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screens-and-logs
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn
          retention-days: 14
