name: CI

on:
  pull_request:
    branches: [develop]

jobs:
  analyze-and-test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

  android-build:
    name: Android Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Install CI google-services stub
        # F158 (Sprint 60): the real google-services.json is gitignored (public
        # repo; it carries the Firebase API key). This job guards the F150
        # regression class -- an Android build broken by config/package
        # mismatch going unnoticed for months -- and the BUILD only needs a
        # structurally-valid config whose client matches the applicationId.
        # The committed stub (android/ci/google-services.ci.json) has the real
        # package name and deliberately fake everything else; CI never runs
        # the app (same reasoning as the F127 empty-dart-defines decision for
        # the Windows job below). A real-config secret becomes worthwhile only
        # if CI ever gains an Android RUNTIME step.
        run: cp android/ci/google-services.ci.json android/app/google-services.json

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build apk --debug
        run: flutter build apk --debug

  windows-build:
    name: Windows Build Verification
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: flutter pub get
        run: flutter pub get

      - name: Write CI secrets file
        shell: pwsh
        env:
          GMAIL_DESKTOP_CLIENT_ID: ${{ secrets.CI_GMAIL_DESKTOP_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.CI_GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_REDIRECT_URI: ${{ secrets.CI_GMAIL_REDIRECT_URI }}
          AOL_EMAIL: ${{ secrets.CI_AOL_EMAIL }}
          AOL_APP_PASSWORD: ${{ secrets.CI_AOL_APP_PASSWORD }}
        run: |
          # F127 (Sprint 50, Harold decision 2026-07-24): the CI_* repo
          # secrets are DELIBERATELY UNSET. Empty-string dart-defines fully
          # exercise everything this job verifies -- the values are read at
          # RUNTIME only, and CI never runs the app. Populate them ONLY when
          # CI gains a runtime step that would actually use credentials
          # (integration/smoke test); until then, keeping real OAuth values
          # out of GitHub buys security for zero verification loss.
          #
          # Key names below are the CURRENT runtime keys (WINDOWS_GMAIL_*).
          # The original F64 version wrote the pre-Sprint-36 legacy names
          # (GMAIL_DESKTOP_CLIENT_ID / GMAIL_OAUTH_CLIENT_SECRET), which the
          # runtime only accepts via a dev-compat fallback -- the exact
          # stale-key class docs/STORE_RELEASE_PROCESS.md warns about.
          $json = @{
            WINDOWS_GMAIL_DESKTOP_CLIENT_ID = $env:GMAIL_DESKTOP_CLIENT_ID
            WINDOWS_GMAIL_DESKTOP_CLIENT_SECRET = $env:GMAIL_OAUTH_CLIENT_SECRET
            GMAIL_REDIRECT_URI = $env:GMAIL_REDIRECT_URI
            AOL_EMAIL = $env:AOL_EMAIL
            AOL_APP_PASSWORD = $env:AOL_APP_PASSWORD
          } | ConvertTo-Json
          Set-Content -Path secrets.ci.json -Value $json

      - name: flutter build windows
        run: flutter build windows --release --dart-define-from-file=secrets.ci.json

      - name: Remove CI secrets file
        if: always()
        shell: pwsh
        run: Remove-Item -Path secrets.ci.json -Force -ErrorAction SilentlyContinue
